<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/UTFSM_Cubesat_team/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="USM Cubesat Team - Equipo universitario de desarrollo de nano satélites" />
    <!-- Security: block plugin execution and base-tag injection -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://*.google.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com wss://*.firebaseio.com https://script.google.com https://script.googleusercontent.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; object-src 'none'; base-uri 'self'; form-action 'self';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>USM Cubesat Team</title>
    <!--
      Anti-clickjacking guard. The two header-based defenses (`X-Frame-Options` and CSP
      `frame-ancestors`) are both ignored when delivered in a <meta> tag, and GitHub Pages does
      not let us set response headers, so the app could be framed by any origin and used for UI
      redress — overlaying an invisible frame of the workspace over attacker content to harvest
      clicks on privileged controls (role changes, member deletion, digest dispatch) from a
      signed-in maestro. Blanking the document when framed removes the target; the top-level
      navigation is best effort and may be blocked, which is why it is not the primary defense.
    -->
    <script type="text/javascript">
      (function () {
        if (window.top !== window.self) {
          document.documentElement.style.display = 'none';
          try {
            window.top.location = window.self.location.href;
          } catch (e) {
            /* cross-origin parent: staying blanked is the defense */
          }
        }
      })();
    </script>
    <!-- GitHub Pages SPA redirect handler -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
