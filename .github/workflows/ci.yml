name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  check-unresolved-bot-reviews:
    name: Check Unresolved Bot Reviews
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    steps:
      - name: Verify all bot review comments are resolved
        uses: actions/github-script@v7
        with:
          script: |
            const query = `
              query($owner: String!, $repo: String!, $pr: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $pr) {
                    reviewThreads(first: 100) {
                      nodes {
                        id
                        isResolved
                        comments(first: 5) {
                          nodes {
                            id
                            author {
                              login
                              __typename
                            }
                            body
                            path
                            line
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;
            const variables = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pr: context.payload.pull_request.number
            };
            const result = await github.graphql(query, variables);
            const threads = result.repository.pullRequest.reviewThreads.nodes || [];

            const KNOWN_BOT_LOGINS = [
              'sentry',
              'sentry[bot]',
              'coderabbitai',
              'coderabbitai[bot]',
              'codecov',
              'codecov[bot]',
              'sonarcloud',
              'sonarcloud[bot]',
              'github-actions',
              'github-actions[bot]',
              'copilot',
              'copilot[bot]',
              'gemini-code-assist',
              'gemini-code-assist[bot]',
            ];

            const isBotAuthor = (author) => {
              if (!author) return false;
              if (author.__typename === 'Bot') return true;
              const login = (author.login || '').toLowerCase();
              if (login.endsWith('[bot]')) return true;
              return KNOWN_BOT_LOGINS.includes(login);
            };

            const unresolvedBotThreads = [];
            for (const thread of threads) {
              if (thread.isResolved) continue;
              const firstComment = thread.comments?.nodes?.[0];
              if (!firstComment) continue;

              if (isBotAuthor(firstComment.author)) {
                unresolvedBotThreads.push({
                  author: firstComment.author.login,
                  path: firstComment.path,
                  line: firstComment.line,
                  bodyPreview: firstComment.body
                    ? firstComment.body.substring(0, 150).replace(/\r?\n/g, ' ')
                    : '',
                });
              }
            }

            if (unresolvedBotThreads.length > 0) {
              core.setFailed(
                `Found ${unresolvedBotThreads.length} unresolved review conversation(s) from reviewer bots:\n` +
                unresolvedBotThreads.map(t => `- [${t.author}] at ${t.path}:${t.line || '?'} -> "${t.bodyPreview}..."`).join('\n') +
                '\n\nPlease address the feedback and mark all bot review conversations as resolved before merging.'
              );
            } else {
              core.info('✅ All bot review conversations are resolved (or none exist).');
            }

  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'ci-placeholder' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'ci-placeholder.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'ci-placeholder' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'ci-placeholder.appspot.com' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '000000000000' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || '1:000000000000:web:ci-placeholder' }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID || 'G-CI00000000' }}
          VITE_GOOGLE_AI_KEY: ${{ secrets.VITE_GOOGLE_AI_KEY || 'AIzaSy-fallback-dummy-ci-key' }}
          VITE_DRIVE_UPLOAD_URL: ${{ secrets.VITE_DRIVE_UPLOAD_URL || '' }}
          VITE_DRIVE_UPLOAD_SECRET: ${{ secrets.VITE_DRIVE_UPLOAD_SECRET || '' }}

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'ci-placeholder' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'ci-placeholder.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'ci-placeholder' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'ci-placeholder.appspot.com' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '000000000000' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || '1:000000000000:web:ci-placeholder' }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID || 'G-CI00000000' }}
          VITE_GOOGLE_AI_KEY: ${{ secrets.VITE_GOOGLE_AI_KEY || 'AIzaSy-fallback-dummy-ci-key' }}
          VITE_DRIVE_UPLOAD_URL: ${{ secrets.VITE_DRIVE_UPLOAD_URL || '' }}
          VITE_DRIVE_UPLOAD_SECRET: ${{ secrets.VITE_DRIVE_UPLOAD_SECRET || '' }}
