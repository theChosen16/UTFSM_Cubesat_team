name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Least privilege at the top level: only the job that actually publishes gets `pages`/`id-token`.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # SECURITY — provenance gate for the `workflow_run` trigger.
    #
    # `workflow_run` fires in the context of THIS repository (with its secrets), but the
    # `branches:` filter matches the *triggering* run's head branch, which for a pull request is
    # the contributor's branch name — including a fork's. CI runs on `pull_request`, so a fork
    # whose default branch is called `main` produced a completed CI run with
    # head_branch == 'main', which satisfied the old condition. This job then checked out
    # `workflow_run.head_sha` — the fork's commit — and ran `npm ci` + `npm run build` on it with
    # the production Firebase secrets in the environment and `pages: write` in scope. That is
    # arbitrary code execution from an unreviewed pull request (the classic "pwn request"), able
    # to exfiltrate every secret above and publish attacker-controlled content to the live
    # GitHub Pages site.
    #
    # The head commit is only trusted when the triggering run came from a `push` to `main` in
    # THIS repository, which is code that already passed through branch protection.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build with Vite
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          # SECURITY: do NOT inject VITE_GOOGLE_AI_KEY or VITE_DRIVE_UPLOAD_SECRET into the
          # production build. Both are only consumed in DEV-gated code paths, so in a prod
          # build Vite tree-shakes them away — but if that gate ever regresses, the secret
          # would be inlined into the public GitHub Pages bundle (this exact footgun already
          # leaked a Gemini key into git history once). In production the bot routes through
          # the Apps Script proxy and the Drive secret is fetched at runtime from Firestore.
          VITE_DRIVE_UPLOAD_URL: ${{ secrets.VITE_DRIVE_UPLOAD_URL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    runs-on: ubuntu-latest
    permissions: {}
    needs: deploy
    steps:
      - name: Wait for deployment to propagate
        run: sleep 30

      - name: Verify deployment is accessible
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://thechosen16.github.io/UTFSM_Cubesat_team/")
          echo "HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Deployment health check failed with status $HTTP_STATUS"
            exit 1
          fi
          echo "✅ Deployment health check passed"
